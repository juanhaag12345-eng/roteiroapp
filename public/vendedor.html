<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VendRoute - Vendedor</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Rota do vendedor</h1>
    <nav><a href="/">inicio</a><a href="/gestor.html">painel do gestor</a></nav>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <div class="col">
          <label for="selVendedor">Vendedor</label>
          <select id="selVendedor"></select>
        </div>
        <div class="col">
          <label for="selDia">Dia de atendimento</label>
          <select id="selDia"></select>
        </div>
      </div>
      <button id="btnTracar">Tracar melhor rota</button>
      <div id="msgRota"></div>
      <div class="stat-row" id="statsRota" style="display:none">
        <div class="stat"><strong id="statDistancia">-</strong>distancia estimada</div>
        <div class="stat"><strong id="statDuracao">-</strong>tempo estimado</div>
        <div class="stat"><strong id="statParadas">-</strong>paradas</div>
        <div class="stat"><strong id="statFonte">-</strong>calculo</div>
      </div>
      <div id="erroRastreio" class="erro" style="display:none"></div>
    </div>

    <div class="card">
      <div id="mapa"></div>
      <ol class="lista-paradas" id="listaParadas"></ol>
    </div>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/vendedor.js"></script>
</body>
</html>
